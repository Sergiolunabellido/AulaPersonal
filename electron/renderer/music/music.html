<div id="music-app" class="page-fill flex flex-col h-[calc(100dvh-10rem)] md:h-[calc(100dvh-2rem)] min-h-0 -mx-3 sm:-mx-4 -my-3 sm:-my-4">
  <div class="flex-1 flex flex-col overflow-hidden bg-gray-50 min-h-0">
    <div class="px-3 sm:px-4 pt-3 sm:pt-4 pb-3 flex items-center gap-3 flex-wrap">
      <div class="relative flex-1 min-w-[160px] max-w-md">
        <input id="search-input" type="text" placeholder="Buscar emisoras..." class="w-full pl-9 pr-4 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent bg-white">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">&#x1F50D;</span>
      </div>
      <div id="station-count" class="text-xs text-gray-400 font-medium">0 emisoras</div>
    </div>

    <div id="content-wrap" class="flex-1 overflow-y-auto px-3 sm:px-4 pb-4 min-h-0">
      <div id="loading-indicator" class="text-center py-12 hidden">
        <div class="animate-spin w-8 h-8 border-4 border-purple-300 border-t-purple-600 rounded-full mx-auto mb-3"></div>
        <p class="text-sm text-gray-400">Cargando emisoras...</p>
      </div>
      <div id="empty-state" class="text-center py-16 hidden">
        <p class="text-4xl mb-3">&#x1F4FB;</p>
        <p class="text-gray-500 font-medium">No se encontraron emisoras</p>
        <p class="text-sm text-gray-400 mt-1">Prueba con otro t&eacute;rmino de b&uacute;squeda</p>
      </div>
      <div id="error-state" class="text-center py-16 hidden">
        <p class="text-4xl mb-3">&#x26A0;&#xFE0F;</p>
        <p class="text-gray-500 font-medium">Error al cargar emisoras</p>
        <p class="text-sm text-gray-400 mt-1">No se pudo conectar con el servidor</p>
      </div>
      <div id="station-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3"></div>
    </div>
  </div>

  <div id="player-bar" class="bg-gray-900 text-white shrink-0 px-3 sm:px-4 py-2.5 flex items-center gap-2 sm:gap-3">
    <div id="player-favicon" class="w-9 h-9 lg:w-10 lg:h-10 bg-gray-700 rounded-lg flex items-center justify-center text-sm lg:text-lg shrink-0 overflow-hidden">
      <span class="text-lg">&#x1F4FB;</span>
    </div>
    <div class="min-w-0 flex-1">
      <div id="player-name" class="text-sm font-medium truncate">Sin reproducci&oacute;n</div>
      <div id="player-meta" class="text-xs text-gray-400 truncate">Selecciona una emisora</div>
    </div>
    <button id="btn-play" class="w-9 h-9 lg:w-10 lg:h-10 bg-purple-600 rounded-full flex items-center justify-center hover:bg-purple-500 transition-colors text-base lg:text-lg shrink-0 disabled:opacity-40" onclick="window.togglePlay()" disabled>&#x25B6;&#xFE0F;</button>
    <div class="hidden lg:flex items-center gap-2">
      <button id="btn-mute" class="text-gray-400 hover:text-white transition-colors text-sm" onclick="window.toggleMute()">&#x1F50A;</button>
      <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.8" class="w-20 h-1 accent-purple-500 cursor-pointer" oninput="window.ajustarVolumen(this.value)">
    </div>
    <button id="btn-mute-mobile" class="lg:hidden text-gray-400 hover:text-white transition-colors text-sm" onclick="window.toggleMute()">&#x1F50A;</button>
  </div>
</div>

<script src="./music/music.js"></script>
